<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Explore on Map | Wallawalla</title>

    <link
        rel="icon"
        type="image/png"
        href="{{ url_for('static', filename='images/wallawalla-circular.png') }}"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f7fa;
        }


        body {
            display: flex;
            flex-direction: column;
        }


        /* =========================================
           MAP HEADER
        ========================================== */

        .map-header {
            min-height: 74px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 16px;

            padding: 12px 22px;

            background: #ffffff;

            border-bottom: 1px solid #e5e7eb;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.08);

            position: relative;

            z-index: 10;
        }


        .map-brand {
            display: flex;
            align-items: center;
            gap: 11px;
        }


        .map-brand img {
            width: 47px;
            height: 47px;

            object-fit: contain;
        }


        .map-brand-text strong {
            display: block;

            font-size: 20px;
            font-weight: 900;

            line-height: 1.1;
        }


        .brand-green {
            color: #68b92e;
        }


        .brand-blue {
            color: #1478dc;
        }


        .map-brand-text small {
            display: block;

            margin-top: 3px;

            color: #6b7280;

            font-size: 12px;
        }


        .map-header-location {
            flex: 1;

            text-align: center;

            color: #374151;

            font-size: 14px;
            font-weight: 600;
        }


        .map-header-location i {
            margin-right: 6px;

            color: #ef4444;
        }


        .back-home-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            gap: 7px;

            padding: 11px 18px;

            border: none;
            border-radius: 22px;

            color: #ffffff;
            background: #1478dc;

            font-size: 13px;
            font-weight: 700;

            text-decoration: none;

            cursor: pointer;
        }


        /* =========================================
           FILTERS
        ========================================== */

        .map-filters {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 10px;

            padding: 10px 15px;

            background: #ffffff;

            border-bottom: 1px solid #e5e7eb;

            position: relative;

            z-index: 9;
        }


        .map-filter-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            gap: 7px;

            padding: 9px 16px;

            border: 1px solid #d1d5db;
            border-radius: 20px;

            background: #ffffff;
            color: #4b5563;

            font-size: 13px;
            font-weight: 700;

            cursor: pointer;
        }


        .map-filter-button.active {
            color: #ffffff;
            border-color: #1478dc;
            background: #1478dc;
        }


        .map-filter-button.business-filter.active {
            border-color: #16a34a;
            background: #16a34a;
        }


        .map-filter-button.property-filter.active {
            border-color: #1478dc;
            background: #1478dc;
        }

        .map-filters {
            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 7px;

            padding: 9px 15px;

            background: #ffffff;

            border-bottom: 1px solid #e5e7eb;

            position: relative;

            z-index: 9;
        }


        .map-filter-buttons {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 10px;

            width: 100%;
        }


        .map-category-row {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
        }


        .category-filter-wrapper {
            display: none;

            width: 100%;
            max-width: 380px;
        }


        .category-filter-wrapper.visible {
            display: flex;
        }


        .category-filter-select {
            width: 100%;

            padding: 9px 35px 9px 14px;

            border: 1px solid #d1d5db;
            border-radius: 20px;

            background: #ffffff;
            color: #374151;

            font-size: 13px;
            font-weight: 700;

            cursor: pointer;
            outline: none;
        }


        #business-category-wrapper .category-filter-select {
            border-color: #16a34a;
        }


        #business-category-wrapper .category-filter-select:focus {
            border-color: #16a34a;

            box-shadow:
                0 0 0 3px rgba(22, 163, 74, 0.12);
        }


        #property-category-wrapper .category-filter-select {
            border-color: #1478dc;
        }


        #property-category-wrapper .category-filter-select:focus {
            border-color: #1478dc;

            box-shadow:
                0 0 0 3px rgba(20, 120, 220, 0.12);
        }

        /* =========================================
        CARS AND JOBS FILTER COLOURS
        ========================================== */

        .map-filter-button.car-filter.active {
            border-color: #7c3aed;
            background: #7c3aed;
            color: #ffffff;
        }

        .map-filter-button.job-filter.active {
            border-color: #f97316;
            background: #f97316;
            color: #ffffff;
        }


        /* =========================================
        CATEGORY DROPDOWN BORDERS
        ========================================== */

        /* Cars - Purple */

        #car-category-wrapper .category-filter-select {
            border-color: #7c3aed;
        }

        #car-category-wrapper .category-filter-select:focus {
            border-color: #7c3aed;

            box-shadow:
                0 0 0 3px rgba(124, 58, 237, 0.12);
        }


        /* Jobs - Orange */

        #job-category-wrapper .category-filter-select {
            border-color: #f97316;
        }

        #job-category-wrapper .category-filter-select:focus {
            border-color: #f97316;

            box-shadow:
                0 0 0 3px rgba(249, 115, 22, 0.12);
        }


        /* =========================================
        MAP SUMMARY COLOURS
        ========================================== */

        .car-summary {
            color: #7c3aed;
        }

        .car-summary i {
            color: #7c3aed;
        }


        .job-summary {
            color: #ea580c;
        }

        .job-summary i {
            color: #f97316;
        }


        /* =========================================
           MAP
        ========================================== */

        .map-wrapper {
            position: relative;

            flex: 1;

            min-height: 400px;
        }


        #wallawalla-map {
            width: 100%;
            height: 100%;
        }


        /* =========================================
           LOADING
        ========================================== */

        .map-loading {
            position: absolute;

            top: 18px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 7;

            display: flex;
            align-items: center;

            gap: 10px;

            padding: 12px 20px;

            border-radius: 24px;

            background: rgba(255, 255, 255, 0.96);

            color: #374151;

            font-size: 13px;
            font-weight: 700;

            box-shadow:
                0 4px 16px rgba(0, 0, 0, 0.16);
        }


        /* =========================================
           MAP SUMMARY
        ========================================== */

        .map-summary {
            position: absolute;

            left: 16px;
            bottom: 24px;

            z-index: 7;

            display: flex;
            flex-direction: column;

            gap: 7px;

            padding: 13px 16px;

            background: rgba(255, 255, 255, 0.96);

            border-radius: 14px;

            box-shadow:
                0 5px 18px rgba(0, 0, 0, 0.18);
        }


        .summary-item {
            display: flex;
            align-items: center;

            gap: 8px;

            font-size: 13px;
            font-weight: 700;
        }


        .business-summary {
            color: #15803d;
        }


        .property-summary {
            color: #1469c7;
        }


        /* =========================================
           INFO WINDOW
        ========================================== */

        .wallawalla-info-window {
            min-width: 210px;
            max-width: 270px;

            padding: 3px;
        }


        .wallawalla-info-window h3 {
            margin: 0 0 7px;

            color: #111827;

            font-size: 16px;
        }


        .wallawalla-info-window p {
            margin: 4px 0;

            color: #6b7280;

            font-size: 12px;
            line-height: 1.4;
        }


        .wallawalla-info-window a {
            display: inline-flex;
            align-items: center;

            gap: 6px;

            margin-top: 9px;
            padding: 8px 13px;

            border-radius: 17px;

            color: #ffffff;
            background: #1478dc;

            font-size: 12px;
            font-weight: 700;

            text-decoration: none;
        }


        /* =========================================
           MOBILE
        ========================================== */

        @media (max-width: 700px) {

            .map-header {
                min-height: 65px;

                padding: 9px 11px;
            }


            .map-brand img {
                width: 39px;
                height: 39px;
            }


            .map-brand-text strong {
                font-size: 16px;
            }


            .map-brand-text small {
                display: none;
            }


            .map-header-location {
                display: none;
            }


            .back-home-button {
                padding: 9px 12px;

                font-size: 12px;
            }


            .map-filters {
                padding: 8px 10px;

                overflow: visible;
            }


            .map-filter-buttons {
                overflow-x: auto;

                justify-content: flex-start;

                width: 100%;

                padding-bottom: 1px;
            }


            .map-filter-button {
                flex-shrink: 0;

                padding: 8px 13px;

                font-size: 12px;
            }


            .map-category-row {
                width: 100%;
            }


            .category-filter-wrapper {
                width: 100%;
                max-width: none;
            }


            .category-filter-select {
                width: 100%;

                padding: 9px 34px 9px 13px;

                font-size: 12px;
            }

            .map-summary {
                left: 10px;
                bottom: 15px;

                padding: 10px 12px;
            }

        }

        @media (max-width: 700px) {

            .map-filters {
                padding: 8px 10px;
                overflow: visible;
            }


            .map-filter-buttons {
                display: grid;

                grid-template-columns:
                    repeat(6, minmax(0, 1fr));

                gap: 7px;

                width: 100%;

                overflow: visible;

                padding-bottom: 1px;
            }


            /*
            * First row:
            * All | Businesses | Properties
            */

            #show-all-button,
            #show-business-button,
            #show-property-button {
                grid-column: span 2;
            }


            /*
            * Second row:
            * Cars | Jobs
            */

            #show-car-button {
                grid-column: 2 / span 2;
            }

            #show-job-button {
                grid-column: 4 / span 2;
            }


            .map-filter-button {
                width: 100%;
                min-width: 0;

                flex-shrink: 1;

                padding: 8px 5px;

                gap: 4px;

                font-size: 10px;

                white-space: nowrap;
            }


            .map-filter-button i {
                font-size: 11px;
            }


            .map-filter-button span {
                font-size: 10px;
            }


            .map-category-row {
                width: 100%;
            }


            .category-filter-wrapper {
                width: 100%;
                max-width: none;
            }


            .category-filter-select {
                width: 100%;

                padding: 9px 34px 9px 13px;

                font-size: 12px;
            }

        }

        .radius-summary {
            color: #1478dc;
        }

        .radius-summary i {
            color: #1478dc;
        }

    

    </style>

</head>


<body>


<header class="map-header">

    <div class="map-brand">

        <img
            src="{{ url_for('static', filename='images/walla-w.png') }}"
            alt="Wallawalla"
        >

        <div class="map-brand-text">

            <strong>
                <span class="brand-green">WALLA</span><span class="brand-blue">WALLA</span>
            </strong>

            <small>
                Explore businesses, properties, cars and jobs
            </small>

        </div>

    </div>


    <div class="map-header-location">

        <i class="fa-solid fa-location-dot"></i>

        {{ address }}

    </div>


    <a
        href="/"
        class="back-home-button"
    >
        <i class="fa-solid fa-arrow-left"></i>

        Back
    </a>

</header>


<section class="map-filters">

    <div class="map-filter-buttons">

        <button
            type="button"
            class="map-filter-button active"
            id="show-all-button"
            onclick="showAllMarkers()"
        >
            <i class="fa-solid fa-map-location-dot"></i>
            All
        </button>


        <button
            type="button"
            class="map-filter-button business-filter"
            id="show-business-button"
            onclick="showBusinessMarkers()"
        >
            <i class="fa-solid fa-store"></i>

            Businesses

            <span id="business-filter-count">0</span>
        </button>


        <button
            type="button"
            class="map-filter-button property-filter"
            id="show-property-button"
            onclick="showPropertyMarkers()"
        >
            <i class="fa-solid fa-house"></i>

            Properties

            <span id="property-filter-count">0</span>
        </button>


        <button
            type="button"
            class="map-filter-button car-filter"
            id="show-car-button"
            onclick="showCarMarkers()"
        >
            <i class="fa-solid fa-car-side"></i>

            Cars

            <span id="car-filter-count">0</span>
        </button>


        <button
            type="button"
            class="map-filter-button job-filter"
            id="show-job-button"
            onclick="showJobMarkers()"
        >
            <i class="fa-solid fa-briefcase"></i>

            Jobs

            <span id="job-filter-count">0</span>
        </button>

    </div>


    <div class="map-category-row">

        <div
            id="business-category-wrapper"
            class="category-filter-wrapper"
        >
            <select
                id="business-category-select"
                class="category-filter-select"
                onchange="filterBusinessMarkersByCategory()"
            >
                <option value="">
                    All business categories
                </option>
            </select>
        </div>


        <div
            id="property-category-wrapper"
            class="category-filter-wrapper"
        >
            <select
                id="property-category-select"
                class="category-filter-select"
                onchange="filterPropertyMarkersByCategory()"
            >
                <option value="">
                    All property categories
                </option>
            </select>
        </div>

        <div
            id="car-category-wrapper"
            class="category-filter-wrapper"
        >
            <select
                id="car-category-select"
                class="category-filter-select"
                onchange="filterCarMarkersByCategory()"
            >
                <option value="">
                    All car categories
                </option>
            </select>
        </div>


        <div
            id="job-category-wrapper"
            class="category-filter-wrapper"
        >
            <select
                id="job-category-select"
                class="category-filter-select"
                onchange="filterJobMarkersByCategory()"
            >
                <option value="">
                    All job categories
                </option>
            </select>
        </div>

    </div>

</section>


<main class="map-wrapper">

    <div id="wallawalla-map"></div>


    <div
        id="map-loading"
        class="map-loading"
    >
        <i class="fa-solid fa-spinner fa-spin"></i>

        Loading businesses and properties...
    </div>


    <div class="map-summary">

        <div class="summary-item business-summary">

            <i class="fa-solid fa-store"></i>

            <span id="business-map-count">0 businesses</span>

        </div>


        <div class="summary-item property-summary">

            <i class="fa-solid fa-house"></i>

            <span id="property-map-count">0 properties</span>

        </div>

        <div class="summary-item car-summary">

            <i class="fa-solid fa-car-side"></i>

            <span id="car-map-count">
                0 cars
            </span>

        </div>


        <div class="summary-item job-summary">

            <i class="fa-solid fa-briefcase"></i>

            <span id="job-map-count">
                0 jobs
            </span>

        </div>

        <div class="summary-item radius-summary">

            <i class="fa-solid fa-circle-dot"></i>

            <span>
                50 km search radius
            </span>

        </div>


    </div>

</main>


<script>

    const selectedLatitude =
        Number("{{ latitude }}");

    const selectedLongitude =
        Number("{{ longitude }}");
    
        /*
    * Replace these two values with the final
    * Cars and Jobs platform URLs.
    */

    const carPlatformUrl =
           "https://cars.wallawalla.co.za";

    const jobsPlatformUrl =
        "YOUR_JOBS_PLATFORM_URL";


    let wallawallaMap = null;

    let businessMarkers = [];

    let propertyMarkers = [];

    let carMarkers = [];

    let jobMarkers = [];

    let selectedLocationMarker = null;
    let activeInfoWindow = null;

    let searchRadiusCircle = null;
    let markerPositionCounts = {};
    let businessCategories = new Set();
    let propertyCategories = new Set();
    let carCategories = new Set();
    let jobCategories = new Set();


    /* =============================================
       INITIALIZE MAP
    ============================================== */

    async function initializeWallawallaMap() {

        const selectedPosition = {

            lat:
                selectedLatitude,

            lng:
                selectedLongitude

        };


        wallawallaMap =
            new google.maps.Map(

                document.getElementById(
                    "wallawalla-map"
                ),

                {
                    center:
                        selectedPosition,

                    zoom:
                        13,

                    mapTypeControl:
                        false,

                    streetViewControl:
                        false,

                    fullscreenControl:
                        true
                }

            );
        
        /* =============================================
           50 KM SEARCH RADIUS
        ============================================== */

        searchRadiusCircle =
            new google.maps.Circle({

                map:
                    wallawallaMap,

                center:
                    selectedPosition,

                radius:
                    50000, // Google Maps uses metres = 50 km

                strokeColor:
                    "#1478dc",

                strokeOpacity:
                    0.9,

                strokeWeight:
                    3,

                fillColor:
                    "#1478dc",

                fillOpacity:
                    0.08,

                clickable:
                    false,

                zIndex:
                    1
            });
        
        /* Reserve the user's selected position */
        const selectedLocationKey =
            `${selectedLatitude.toFixed(5)},${selectedLongitude.toFixed(5)}`;

        markerPositionCounts[
            selectedLocationKey
        ] = 1;


        selectedLocationMarker =
            new google.maps.Marker({

                position:
                    selectedPosition,

                map:
                    wallawallaMap,

                title:
                    "Selected location",

                zIndex:
                    1000,

                icon: {

                    path:
                        google.maps.SymbolPath.CIRCLE,

                    fillColor:
                        "#ef4444",

                    fillOpacity:
                        1,

                    strokeColor:
                        "#ffffff",

                    strokeWeight:
                        4,

                    scale:
                        10
                }

            });


        const locationInfoWindow =
            new google.maps.InfoWindow({

                content: `
                    <div class="wallawalla-info-window">
                        <h3>Your selected location</h3>

                        <p>
                            {{ address | e }}
                        </p>
                    </div>
                `

            });


        selectedLocationMarker.addListener(

            "click",

            function () {

                closeActiveInfoWindow();

                locationInfoWindow.open({

                    anchor:
                        selectedLocationMarker,

                    map:
                        wallawallaMap

                });


                activeInfoWindow =
                    locationInfoWindow;

            }

        );


        await Promise.all([

            loadBusinesses(),

            loadProperties(),

            loadCars(),

            loadJobs()

        ]);


    /*
    * Default map view:
    * show the complete 50 km Wallawalla radius.
    */

    fitRadiusCircleToScreen();


    document.getElementById(
        "map-loading"
    ).style.display = "none";


        // await Promise.all([

        //     loadBusinesses(),

        //     loadProperties()

        // ]);


        // fitMapToMarkers();


        // document.getElementById(
        //     "map-loading"
        // ).style.display = "none";

    }


    /* =============================================
       LOAD BUSINESSES
    ============================================== */

    async function loadBusinesses() {

        try {

            const parameters =
                new URLSearchParams({

                    latitude:
                        String(selectedLatitude),

                    longitude:
                        String(selectedLongitude),

                    radius:
                        "50"

                });


            const response = await fetch(

                "https://search.wallawalla.co.za/api/map-businesses?"
                + parameters.toString()

            );


            if (!response.ok) {

                throw new Error(
                    `Business request failed: ${response.status}`
                );

            }


            const data =
                await response.json();


            const businesses =
                Array.isArray(data.businesses)
                    ? data.businesses
                    : [];


            businesses.forEach(

                function (business) {

                    createBusinessMarker(
                        business
                    );

                }

            );


            updateBusinessCount(
                businesses.length
            );

        } catch (error) {

            console.error(
                "Unable to load map businesses:",
                error
            );


            updateBusinessCount(0);

        }

    }


    /* =============================================
       LOAD PROPERTIES
    ============================================== */

    async function loadProperties() {

        try {

            const parameters =
                new URLSearchParams({

                    latitude:
                        String(selectedLatitude),

                    longitude:
                        String(selectedLongitude),

                    radius:
                        "50"

                });


            const response = await fetch(

                "https://property.wallawalla.co.za/api/map-properties?"
                + parameters.toString()

            );


            if (!response.ok) {

                throw new Error(
                    `Property request failed: ${response.status}`
                );

            }


            const data =
                await response.json();


            const properties =
                Array.isArray(data.properties)
                    ? data.properties
                    : [];


            properties.forEach(

                function (property) {

                    createPropertyMarker(
                        property
                    );

                }

            );


            updatePropertyCount(
                properties.length
            );

        } catch (error) {

            console.error(
                "Unable to load map properties:",
                error
            );


            updatePropertyCount(0);

        }

    }

    /* =============================================
    LOAD CARS
    ============================================== */

    async function loadCars() {

        if (
            !carPlatformUrl
            || carPlatformUrl
                === "YOUR_CAR_PLATFORM_URL"
        ) {

            console.warn(
                "Cars map URL has not been configured."
            );

            updateCarCount(0);

            return;
        }


        try {

            const parameters =
                new URLSearchParams({

                    latitude:
                        String(selectedLatitude),

                    longitude:
                        String(selectedLongitude),

                    radius:
                        "50"

                });


            const endpoint =
                carPlatformUrl.replace(
                    /\/+$/,
                    ""
                )
                + "/api/map-cars?"
                + parameters.toString();


            const response =
                await fetch(endpoint);


            if (!response.ok) {

                throw new Error(
                    `Cars request failed: ${response.status}`
                );

            }


            const data =
                await response.json();


            const cars =
                Array.isArray(data.cars)
                    ? data.cars
                    : [];


            cars.forEach(

                function (car) {

                    createCarMarker(
                        car
                    );

                }

            );


            updateCarCount(
                cars.length
            );

        } catch (error) {

            console.error(
                "Unable to load map cars:",
                error
            );


            updateCarCount(0);

        }

    }

    /* =============================================
    LOAD JOBS
    ============================================== */

    async function loadJobs() {

        if (
            !jobsPlatformUrl
            || jobsPlatformUrl
                === "YOUR_JOBS_PLATFORM_URL"
        ) {

            console.warn(
                "Jobs map URL has not been configured."
            );

            updateJobCount(0);

            return;
        }


        try {

            const parameters =
                new URLSearchParams({

                    latitude:
                        String(selectedLatitude),

                    longitude:
                        String(selectedLongitude),

                    radius:
                        "50"

                });


            const endpoint =
                jobsPlatformUrl.replace(
                    /\/+$/,
                    ""
                )
                + "/api/map-jobs?"
                + parameters.toString();


            const response =
                await fetch(endpoint);


            if (!response.ok) {

                throw new Error(
                    `Jobs request failed: ${response.status}`
                );

            }


            const data =
                await response.json();


            const jobs =
                Array.isArray(data.jobs)
                    ? data.jobs
                    : [];


            jobs.forEach(

                function (job) {

                    createJobMarker(
                        job
                    );

                }

            );


            updateJobCount(
                jobs.length
            );

        } catch (error) {

            console.error(
                "Unable to load map jobs:",
                error
            );


            updateJobCount(0);

        }

    }

    /* =============================================
    PREVENT OVERLAPPING MARKERS
    ============================================== */

    function getVisibleMarkerPosition(
        latitude,
        longitude
    ) {

        /*
        * Group coordinates that are effectively
        * in the same location.
        */
        const key =
            `${latitude.toFixed(5)},${longitude.toFixed(5)}`;

        if (
            markerPositionCounts[key]
            === undefined
        ) {
            markerPositionCounts[key] = 0;
        }


        const markerIndex =
            markerPositionCounts[key];

        markerPositionCounts[key]++;


        /*
        * First marker stays exactly at the
        * real location.
        */
        if (markerIndex === 0) {

            return {
                lat: latitude,
                lng: longitude
            };

        }


        /*
        * Additional markers are arranged
        * in circles around the real location.
        */

        const markersPerRing = 8;

        const ring =
            Math.floor(
                (markerIndex - 1)
                / markersPerRing
            ) + 1;

        const positionInRing =
            (markerIndex - 1)
            % markersPerRing;


        const angle =
            (
                positionInRing
                / markersPerRing
            )
            * Math.PI
            * 2;


        /*
        * Approximately 10-12 metres for ring 1.
        * Additional rings move slightly farther out.
        */

        const offset =
            0.00010 * ring;


        return {

            lat:
                latitude
                + Math.sin(angle)
                * offset,

            lng:
                longitude
                + Math.cos(angle)
                * offset

        };
    }

    function updateBusinessCategoryOptions() {
        const select =
            document.getElementById(
                "business-category-select"
            );

        const selectedValue =
            select.value;

        const sortedCategories =
            Array.from(
                businessCategories
            ).sort(
                function (firstCategory, secondCategory) {
                    return firstCategory.localeCompare(
                        secondCategory
                    );
                }
            );

        select.innerHTML = `
            <option value="">
                All business categories
            </option>
        `;

        sortedCategories.forEach(
            function (category) {
                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    category;

                option.textContent =
                    category;

                select.appendChild(
                    option
                );
            }
        );

        if (
            sortedCategories.includes(
                selectedValue
            )
        ) {
            select.value =
                selectedValue;
        }
    }

        );


        propertyMarkers.forEach(
            function (marker) {
                marker.setMap(null);
            }
        );


        jobMarkers.forEach(
            function (marker) {
                marker.setMap(null);
            }
        );


        updateBusinessCount(0);

        updatePropertyCount(0);

        updateCarCount(
            visibleMarkers.length
        );

        updateJobCount(0);


        fitFilteredMarkers(
            visibleMarkers
        );

    }


    function filterJobMarkersByCategory() {

        closeActiveInfoWindow();


        const selectedCategory =
            document.getElementById(
                "job-category-select"
            ).value;


        const visibleMarkers = [];


        jobMarkers.forEach(

            function (marker) {

                const shouldShow =
                    selectedCategory === ""
                    || marker.listingCategory
                        === selectedCategory;


                marker.setMap(
                    shouldShow
                        ? wallawallaMap
                        : null
                );


                if (shouldShow) {

                    visibleMarkers.push(
                        marker
                    );

                }

            }

        );


        businessMarkers.forEach(
            function (marker) {
                marker.setMap(null);
            }
        );


        propertyMarkers.forEach(
            function (marker) {
                marker.setMap(null);
            }
        );


        carMarkers.forEach(
            function (marker) {
                marker.setMap(null);
            }
        );


        updateBusinessCount(0);

        updatePropertyCount(0);

        updateCarCount(0);

        updateJobCount(
            visibleMarkers.length
        );


        fitFilteredMarkers(
            visibleMarkers
        );

    }


    function fitFilteredMarkers(
        markers
    ) {
        if (
            !Array.isArray(markers)
            || markers.length === 0
        ) {
            fitRadiusCircleToScreen();
            return;
        }

        const bounds =
            new google.maps.LatLngBounds();

        bounds.extend({
            lat:
                selectedLatitude,

            lng:
                selectedLongitude
        });

        markers.forEach(
            function (marker) {
                const position =
                    marker.getPosition();

                if (position) {
                    bounds.extend(
                        position
                    );
                }
            }
        );

        wallawallaMap.fitBounds(
            bounds,
            {
                top: 55,
                right: 55,
                bottom: 55,
                left: 55
            }
        );

        google.maps.event.addListenerOnce(
            wallawallaMap,
            "idle",
            function () {
                if (
                    wallawallaMap.getZoom() > 15
                ) {
                    wallawallaMap.setZoom(
                        15
                    );
                }
            }
        );
    }


    function setActiveFilter(
        activeButtonId
    ) {

        document.querySelectorAll(
            ".map-filter-button"
        ).forEach(

            function (button) {

                button.classList.remove(
                    "active"
                );

            }

        );


        const activeButton =
            document.getElementById(
                activeButtonId
            );


        if (activeButton) {

            activeButton.classList.add(
                "active"
            );

        }

    }


    /* =============================================
       FIT MAP TO MARKERS
    ============================================== */

    function fitMapToMarkers(
        markers = null
    ) {

        const selectedMarkers =
            Array.isArray(markers)
                ? markers
                : [
                    ...businessMarkers,
                    ...propertyMarkers,
                    ...carMarkers,
                    ...jobMarkers
                ];

        const bounds =
            new google.maps.LatLngBounds();


        /*
        * Always include the selected location.
        */

        bounds.extend({

            lat:
                selectedLatitude,

            lng:
                selectedLongitude

        });


        /*
        * Include visible business/property markers.
        */

        selectedMarkers.forEach(

            function (marker) {

                if (marker.getMap()) {

                    bounds.extend(
                        marker.getPosition()
                    );

                }

            }

        );


        /*
        * Include the entire 50 km search radius.
        */

        if (searchRadiusCircle) {

            const circleBounds =
                searchRadiusCircle.getBounds();

            if (circleBounds) {

                bounds.union(
                    circleBounds
                );

            }

        }


        wallawallaMap.fitBounds(
            bounds,
            35
        );
    }

    /* =============================================
    FIT 50 KM RADIUS TO SCREEN
    ============================================== */

    function fitRadiusCircleToScreen() {

        if (
            !wallawallaMap
            || !searchRadiusCircle
        ) {
            return;
        }

        const bounds =
            searchRadiusCircle.getBounds();

        if (!bounds) {
            return;
        }

        wallawallaMap.fitBounds(
            bounds,
            {
                top: 35,
                right: 35,
                bottom: 35,
                left: 35
            }
        );
    }

    /* =============================================
       UTILITIES
    ============================================== */

    function closeActiveInfoWindow() {

        if (activeInfoWindow) {

            activeInfoWindow.close();

        }

    }


    function escapeHtml(
        value
    ) {

        const element =
            document.createElement(
                "div"
            );


        element.textContent =
            value === null
            || value === undefined
                ? ""
                : String(value);


        return element.innerHTML;

    }
